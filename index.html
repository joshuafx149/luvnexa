<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luvnexa</title>
<style>
body{font-family:Arial;background:#f6efff;margin:0;color:#32104f}
main{max-width:400px;margin:45px auto;padding:25px;text-align:center}
h1{color:#853be0}
input{width:90%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:25px;background:#853be0;color:white;font-size:16px}
a{color:#853be0;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Luvnexa 💜</h1>
<p>Connect, share and discover.</p>
<section id="signup">
<h2>Create Account</h2>
<input id="name" placeholder="Your name">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Create password">
<button onclick="register()">Sign Up</button>
<p>Already registered? <a onclick="showLogin()">Log In</a></p>
</section>
<section id="login" class="hidden">
<h2>Welcome Back</h2>
<input id="loginemail" type="email" placeholder="Email address">
<input id="loginpassword" type="password" placeholder="Password">
<button onclick="login()">Log In</button>
<p><a onclick="showSignup()">Create an account</a></p>
</section>
<section id="welcome" class="hidden">
<h2 id="greeting"></h2>
<p>Your Luvnexa journey starts here!</p>
</section>
</main>
<script>
function showLogin(){signup.classList.add('hidden');login.classList.remove('hidden')}
function showSignup(){login.classList.add('hidden');signup.classList.remove('hidden')}
function register(){
if(!name.value.trim()||!email.value.trim()||password.value.length<6){alert('Enter your name, email and a password of at least 6 characters.');return}
alert('This form is ready for connection to a secure account service. Real account creation is not active yet.')
}
function login(){alert('Login needs a secure account service before it can work.')}
</script>
</body>
</html>
