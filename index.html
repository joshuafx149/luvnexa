<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luvnexa</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f0ff;color:#24113d}
main{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;text-align:center}
.logo{font-size:42px;font-weight:bold;color:#8238d8}
.circle{width:100px;height:100px;border-radius:30px;background:linear-gradient(135deg,#a855f7,#ec4899);display:grid;place-items:center;color:white;font-size:48px;margin:20px}
h1{font-size:32px;margin:10px}
p{color:#756784;line-height:1.6}
button{width:100%;max-width:320px;padding:15px;margin-top:12px;border:0;border-radius:30px;background:#8238d8;color:white;font-size:16px;font-weight:bold}
.secondary{background:white;color:#8238d8;border:1px solid #8238d8}
</style>
</head>
<body>
<main>
<div class="logo">Luvnexa</div>
<div class="circle">♡</div>
<h1>Share your world.</h1>
<p>Connect with friends, share your moments,<br>and discover something wonderful.</p>
<button onclick="alert('Sign-up feature coming next!')">Create Account</button>
<button class="secondary" onclick="alert('Login feature coming next!')">Log In</button>
</main>
</body>
</html>
